<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Skoring Pencak Silat</title>
    <meta name="description" content="Sistem skoring digital real-time untuk pertandingan Pencak Silat lengkap dengan Admin Panel, manajemen jadwal dan sekretaris otomatis, serta sinkronisasi multi-gelanggang." />
    <meta property="og:title" content="Skoring Pencak Silat" />
    <meta property="og:description" content="Sistem skoring digital real-time untuk pertandingan Pencak Silat lengkap dengan Admin Panel, manajemen jadwal dan sekretaris otomatis, serta sinkronisasi multi-gelanggang." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#05112e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SkoringSilat" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body class="bg-[#020512] text-slate-100 overflow-x-hidden antialiased select-none">
    <div id="root"></div>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[PWA] Service Worker aktif dengan scope:', reg.scope);
              // Check for SW updates periodically
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] Versi baru aplikasi tersedia.');
                    }
                  };
                }
              };
            })
            .catch(err => {
              console.warn('[PWA] Service Worker registration skipped:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
